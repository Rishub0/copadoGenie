[project]
name = "copado-genie"
version = "0.1.0"
description = "Copado Genie — Agentic DevOps CLI for Salesforce (Track B)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "typing_extensions>=4.11.0",
    "keyring>=25.0.0",
    "rich>=13.0.0",
]

[project.scripts]
copado-genie = "cli.main:app"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["copado_api*", "orchestrator*", "cli*"]
